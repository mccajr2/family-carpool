name: mobile

# KMP under mobile/ is frozen (Expo is the future client; see parking
# `rn-expo-scaffold` / `kmp-mobile-retire`). Path filters still fire so token
# sync under mobile/** does not leave a missing check, but we do not install
# Android SDK / run Gradle — setup-android@v4 fails because sdkmanager package
# `tools` is no longer published. Revive real steps when mobile CI returns.

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: KMP mobile CI frozen
        run: |
          echo "Skipping Android SDK / Gradle — KMP is frozen until Expo CI."
          echo "Prior job: ./gradlew :sharedLogic:testAndroidHostTest :androidApp:assembleDebug"
