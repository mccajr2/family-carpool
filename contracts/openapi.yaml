openapi: 3.0.3
info:
  title: Family Carpool API
  version: 0.21.0
  description: >
    Contract-first API for family-carpool. Adult authentication uses email
    one-time codes and Bearer sessions. Family circles (one per adult in v1)
    hold kids, named places, activity feeds (Organizer-managed iCal/webcal
    subscriptions with soft-fail sync and server-side background polling),
    manual events (any member may CRUD one-off schedule items with 1+ kids),
    a unified circle calendar read (feed + manual items in a time window) with
    per-adult leave-from, per-adult default leave-from, estimated leave-by
    (OSRM or fallback; never live traffic; calendar list does not call
    Nominatim or OSRM — clients fill leave-by via GET …/calendar/leave-by),
    per-kid event RSVP (Yes / No / No response), coverage responsibility
    assignments (assign / reassign / remove; assignee confirm or decline;
    assign/confirm set RSVP Yes and reject No kids; removing CONFIRMED coverage
    auto-withdraws ACCEPTED inbound carpool rides accepted by the caller's
    circle), server-computed schedule conflicts
    on calendar items (kid time-overlaps ignore RSVP No; adult
    coverage overlaps; confirm/self-assign that would create two overlapping
    CONFIRMED coverages for one adult returns 409), a circle garage
    (vehicles with owner + who may drive; including-driver seat counts;
    year/make/model from server-side vPIC lists; seat hints by make/model/year
    — no VIN), and memberships (ORGANIZER / CAREGIVER). Organizers share a
    short invite code; Caregivers join via that code. Any member may manage
    named places (label + free-text address; optional lat/lng from geocoding
    with soft-fail and retry locate), garage vehicles they own, their own
    drives flag, manual events, read the calendar agenda, set their own
    leave-from place per calendar item, set their default leave-from for the
    circle, set per-kid RSVPs on calendar items, and manage coverage
    assignments on calendar items. Feed last-synced / error / event count may
    update from Sync now or from the server poller — clients re-GET the feeds
    list to observe changes. Team carpool spaces (HTTP under `/api/carpool/*`)
    are keyed one per normalized feed URL (same normalize as feeds: trim;
    `webcal://` → `https://`).     Importing a feed never joins a space and never
    returns other families' membership or ride requests. Space members list
    ride requests per event (kid first names, seat counts, pickup address) via
    GET /api/carpool/spaces/{spaceId}/rides — not on the summary. List rides
    marks other PENDING asks the calling adult has passed with
    `passedByMe: true` (soft decline: request stays PENDING; Pass is not final —
    Accept remains allowed while PENDING on non-Focus surfaces). Each ride
    includes `passedByAdultNames` (passer display names ordered by pass time).
    Create ride
    defaults to feed-linked kids who are not RSVP NO (YES and NO_RESPONSE both qualify)
    and not already on this circle's ACCEPTED ride; create does not change RSVP.
    Accept sets RSVP YES for the kids on that ride (requesting circle). An Organizer
    whose circle already has the feed may enable a space
    (that circle owns it).
    Other families join by invite code (admits the circle immediately and
    ensureFeed if the URL is missing) or request to join (same-URL subscriber;
    owner-circle adults admit or decline in-app — no email/push). Membership is
    the family circle. Magic links, passwords, multi-circle membership, invite
    deep links, email/push invite delivery, HTTP-only web cookies, and paid
    live-traffic routing are out of scope for this revision.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: Email OTP sign-in and Bearer sessions
  - name: family
    description: >
      Family circle, kids, named places, circle garage (vehicles + drives
      flag), activity feeds, manual events, unified calendar read (with
      per-adult leave-from, cheap leave-by status including PENDING, per-kid
      RSVPs, coverage assignments, uncovered kid ids, and server-computed
      conflicts), async leave-by fill-in, per-adult default leave-from,
      invite code, and memberships (one circle per adult in v1).
      Organizer-only writes for invite regen, roles, remove, kids, circle
      rename, and activity feed create/update/delete/sync. Any member may
      create/update/delete places and vehicles they own, patch their own
      drives flag, retry place geocoding, list the circle calendar, fill
      leave-by estimates, set their leave-from place per calendar item, set
      their default leave-from for the circle, set per-kid RSVPs on calendar
      items, and assign / reassign / remove coverage on calendar items
      (assignee confirm or decline). Garage writes are owner-only (not
      Organizer-gated); listed drivers who are not the owner cannot edit.
  - name: carpool
    description: >
      Team carpool spaces — one space per normalized feed URL, membership by
      family circle (OWNER or MEMBER). Importing a feed does not join a space;
      at most a subscriber sees that a space exists (name + Request / Have a
      code). Enable is Organizer-only and makes that circle the owner.
      Join-by-code admits immediately (Caregiver OK) and ensureFeed if the
      circle lacks that URL. Same-URL subscribers without a code may request;
      owner-circle adults admit or decline in-app (no push). Any space member
      may view/copy the invite code; only the owning circle may regenerate.
      Member circles may leave anytime; the owner may leave only as the sole
      member circle (space is then removed). Space members may list upcoming
      feed events with ride overlays, create ride requests (both legs; pickup
      at the requester's house; default kids = not RSVP NO and still need a
      ride; create leaves RSVP unchanged), accept another circle's pending
      request (sets RSVP YES for kids on the ride; allowed after Pass while
      still PENDING), pass on another circle's pending request (per-adult soft
      decline; request stays PENDING; Focus clients may skip passed asks),
      cancel their own request, or withdraw an acceptance. Ride kid first
      names, seat counts, pickup address, and passer adult display names are
      visible to every adult in member circles. Paths are under
      `/api/carpool/*`, not nested under `/api/family`.

paths:
  /api/auth/request-code:
    post:
      operationId: requestAuthCode
      tags: [auth]
      summary: Request a one-time sign-in code for an email address
      description: >
        Always returns the same success shape whether or not the email is already
        registered (no account enumeration). Delivers a short-lived single-use
        code via the configured mail port. Production-shaped configs must not
        include the plaintext code in the response; a documented dev delivery
        path may log or echo the code for local smoke testing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAuthCodeRequest"
            example:
              email: parent@example.com
      responses:
        "202":
          description: Code accepted for delivery (same body for new or existing emails)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAuthCodeResponse"
              example:
                email: parent@example.com
                expiresInSeconds: 600
                # `devCode` is only present when the server runs with explicit
                # dev code-echo enabled; omit in production-shaped configs.
        "400":
          description: Invalid request (e.g. malformed email)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many code requests for this email or client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/verify-code:
    post:
      operationId: verifyAuthCode
      tags: [auth]
      summary: Verify a one-time code and create a Bearer session
      description: >
        On success, auto-creates an adult account if this email is new, issues
        an opaque Bearer session token, and returns the adult summary. Codes are
        single-use; a second verify with the same code fails.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAuthCodeRequest"
            example:
              email: parent@example.com
              code: "123456"
      responses:
        "200":
          description: Signed in; Bearer token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
              example:
                accessToken: opaque-session-token
                tokenType: Bearer
                adult:
                  id: 01900000-0000-7000-8000-000000000001
                  email: parent@example.com
                  displayName: null
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid, expired, or already-used code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many verify attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      operationId: getCurrentAdult
      tags: [auth]
      summary: Return the adult for the current Bearer session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current adult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Adult"
              example:
                id: 01900000-0000-7000-8000-000000000001
                email: parent@example.com
                displayName: Alex
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke the current Bearer session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Session revoked (idempotent if already revoked)
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle:
    post:
      operationId: createFamilyCircle
      tags: [family]
      summary: Create the current adult's family circle
      description: >
        Creates a circle for an authenticated adult who does not yet belong to
        one. The adult becomes ORGANIZER. Requires an adult display name; circle
        name is optional (clients show "Your family" when unset). Zero kids and
        zero places are allowed. A second create for the same adult returns 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyCircleRequest"
            example:
              adultDisplayName: Alex
              name: McCarthy house
      responses:
        "201":
          description: Circle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCircle"
              example:
                id: 01900000-0000-7000-8000-000000000010
                name: McCarthy house
                role: ORGANIZER
                members:
                  - adultId: 01900000-0000-7000-8000-000000000001
                    email: parent@example.com
                    displayName: Alex
                    role: ORGANIZER
                kids: []
                places: []
        "400":
          description: Invalid request (e.g. blank adult display name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Adult already belongs to a family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      operationId: getFamilyCircle
      tags: [family]
      summary: Get the current adult's family circle, members, kids, and places
      description: >
        Returns the caller's membership role, member list, kids, and named
        places. Does not include the invite code — Organizers fetch that via
        getFamilyInvite.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Circle with membership role, members, kids, and places
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCircle"
              example:
                id: 01900000-0000-7000-8000-000000000010
                name: McCarthy house
                role: ORGANIZER
                members:
                  - adultId: 01900000-0000-7000-8000-000000000001
                    email: parent@example.com
                    displayName: Alex
                    role: ORGANIZER
                  - adultId: 01900000-0000-7000-8000-000000000002
                    email: other@example.com
                    displayName: Sam
                    role: CAREGIVER
                kids:
                  - id: 01900000-0000-7000-8000-000000000021
                    displayName: Sam
                places:
                  - id: 01900000-0000-7000-8000-000000000031
                    name: Mom's house
                    address: 123 Main St
                    latitude: 40.7128
                    longitude: -74.006
                defaultLeaveFromPlaceId: 01900000-0000-7000-8000-000000000031
                defaultLeaveFromPlaceName: Mom's house
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateFamilyCircle
      tags: [family]
      summary: Update the current adult's family circle
      description: >
        Updates the optional circle name. Pass null to clear the name (UI falls
        back to "Your family"). ORGANIZER only; Caregivers receive 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyCircleRequest"
            example:
              name: Our house
      responses:
        "200":
          description: Circle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCircle"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/invite:
    get:
      operationId: getFamilyInvite
      tags: [family]
      summary: Get the circle's current invite code
      description: >
        ORGANIZER only. Returns the single active invite code for the circle.
        Caregivers receive 403. Code has no TTL; regenerate to invalidate.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvite"
              example:
                code: AB12CD34
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/invite/regenerate:
    post:
      operationId: regenerateFamilyInvite
      tags: [family]
      summary: Regenerate the circle's invite code
      description: >
        ORGANIZER only. Replaces the active invite code; the previous code no
        longer accepts joins.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: New invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyInvite"
              example:
                code: XY98ZW76
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/join:
    post:
      operationId: joinFamilyCircle
      tags: [family]
      summary: Join a family circle with an invite code
      description: >
        Authenticated adult with no existing membership joins as CAREGIVER.
        Requires adultDisplayName when the adult's displayName is still null.
        Invalid or regenerated-away codes return 404 (no enumeration of circles).
        Already belonging to any circle returns 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinFamilyCircleRequest"
            example:
              code: AB12CD34
              adultDisplayName: Jordan
      responses:
        "200":
          description: Joined as Caregiver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCircle"
        "400":
          description: Invalid request (e.g. blank code or missing display name when required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite code unknown or no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Adult already belongs to a family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/leave:
    post:
      operationId: leaveFamilyCircle
      tags: [family]
      summary: Leave the current adult's family circle
      description: >
        Caregiver may leave anytime. Organizer may leave only if another
        Organizer remains. Sole Organizer may leave only when they are the only
        member and the circle has zero kids; otherwise 409.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Left the circle (sole Organizer leaving an empty circle also deletes it)
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Leave would leave zero Organizers, or sole Organizer still has kids
            or other members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/members/{adultId}:
    parameters:
      - name: adultId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Member adult id (not the caller's own id for remove)
    patch:
      operationId: updateFamilyMemberRole
      tags: [family]
      summary: Promote or demote a circle member
      description: >
        ORGANIZER only. Sets the member's role to ORGANIZER or CAREGIVER.
        Demoting (or any change) that would leave zero Organizers returns 409.
        Cannot change your own role via this endpoint (use promote of others /
        leave rules).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFamilyMemberRoleRequest"
            example:
              role: ORGANIZER
      responses:
        "200":
          description: Member role updated; returns the circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCircle"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not in the caller's circle (or caller has no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Change would leave the circle with zero Organizers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: removeFamilyMember
      tags: [family]
      summary: Remove a member from the circle
      description: >
        ORGANIZER only. Removes another adult's membership. Cannot remove
        yourself (use leave). Removing the last Organizer returns 409.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Member removed
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not in the caller's circle (or caller has no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Remove would leave the circle with zero Organizers, or attempted self-remove
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/kids:
    post:
      operationId: addKid
      tags: [family]
      summary: Add a kid to the current adult's family circle
      description: ORGANIZER only. Caregivers receive 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKidRequest"
            example:
              displayName: Sam
      responses:
        "201":
          description: Kid created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kid"
              example:
                id: 01900000-0000-7000-8000-000000000021
                displayName: Sam
        "400":
          description: Invalid request (e.g. blank display name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/kids/{kidId}:
    parameters:
      - name: kidId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateKid
      tags: [family]
      summary: Rename a kid in the current adult's family circle
      description: ORGANIZER only. Caregivers receive 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKidRequest"
            example:
              displayName: Samantha
      responses:
        "200":
          description: Kid updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Kid"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kid not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteKid
      tags: [family]
      summary: Remove a kid from the current adult's family circle
      description: >
        ORGANIZER only. Hard-deletes the kid row (acceptable until feeds/events
        exist). Caregivers receive 403.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Kid removed
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Kid not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/places:
    post:
      operationId: addPlace
      tags: [family]
      summary: Add a named place to the current adult's family circle
      description: >
        Any circle member (ORGANIZER or CAREGIVER) may add a place. Place names
        are unique per circle after trim, compared case-insensitively. Duplicate
        names return 409. The trimmed address is geocoded (cache or Nominatim);
        on success the response includes latitude/longitude. Geocode failure or
        no hit still creates the place with null coordinates (soft-fail).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaceRequest"
            example:
              name: Mom's house
              address: 123 Main St
      responses:
        "201":
          description: Place created (coords may be null if geocode soft-failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
              example:
                id: 01900000-0000-7000-8000-000000000031
                name: Mom's house
                address: 123 Main St
                latitude: 40.7128
                longitude: -74.006
        "400":
          description: Invalid request (e.g. blank name or address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Place name already exists in this circle (case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/places/{placeId}:
    parameters:
      - name: placeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updatePlace
      tags: [family]
      summary: Update a named place in the current adult's family circle
      description: >
        Any circle member may update name and/or address. Renaming to a name
        already used by another place in the circle returns 409. Renaming a place
        to its own current name (same after trim + case-insensitive normalize)
        succeeds. Changing the address re-geocodes (soft-fail allowed). Updating
        only the name when coordinates are already present does not require a new
        geocode call.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaceRequest"
            example:
              name: Mom's house
              address: 456 Oak Ave
      responses:
        "200":
          description: Place updated (coords may be null if geocode soft-failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Place not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Place name already exists in this circle (case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deletePlace
      tags: [family]
      summary: Remove a named place from the current adult's family circle
      description: >
        Any circle member may hard-delete a place. Unknown place id or place in
        another circle returns 404 (no leak).
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Place removed
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Place not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/places/{placeId}/locate:
    post:
      operationId: locatePlace
      tags: [family]
      summary: Retry geocoding for a named place
      description: >
        Any circle member may re-run geocoding for the place's current address.
        Success returns the place with latitude/longitude filled. Soft-fail still
        returns 200 with null coordinates (clients treat null as not located).
        Unknown place id or place in another circle returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: placeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Locate attempt finished (coords may remain null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Place"
              example:
                id: 01900000-0000-7000-8000-000000000031
                name: Mom's house
                address: 123 Main St
                latitude: 40.7128
                longitude: -74.006
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Place not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage:
    get:
      operationId: getFamilyGarage
      tags: [family]
      summary: Get the circle garage (vehicles and member drives flags)
      description: >
        Any circle member. Returns every member's `drives` flag (default true)
        and a **flat** `vehicles` array (not nested under the owner). Each
        vehicle includes owner, `driverAdultIds` (who may take that car), and
        optional `keptAtPlaceId`. Same named place does not imply shared
        drivers. Seats are total capacity **including the driver**. Make,
        model, and year come from server-side vPIC lists; clients never send
        or receive a VIN. Non-member or no circle → 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Circle garage snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garage"
              example:
                members:
                  - adultId: 01900000-0000-7000-8000-000000000001
                    displayName: Alex
                    drives: true
                vehicles:
                  - id: 01900000-0000-7000-8000-000000000041
                    ownerAdultId: 01900000-0000-7000-8000-000000000001
                    driverAdultIds:
                      - 01900000-0000-7000-8000-000000000001
                    keptAtPlaceId: 01900000-0000-7000-8000-000000000031
                    label: Blue van
                    year: 2019
                    make: HONDA
                    model: Odyssey
                    seats: 8
                    suggestedSeats: 8
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/me:
    patch:
      operationId: patchGarageDrives
      tags: [family]
      summary: Set whether the current adult drives
      description: >
        Own `drives` flag only. `false` means "I don't drive" without changing
        role. Does not delete owned vehicles or strip the caller from other
        vehicles' driver lists. There is no path to patch another adult's
        flag.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchGarageDrivesRequest"
            example:
              drives: false
      responses:
        "200":
          description: Flag updated; returns the circle garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Garage"
        "400":
          description: Invalid request (e.g. missing `drives`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/makes:
    get:
      operationId: listGarageMakes
      tags: [family]
      summary: List vehicle makes from server-side vPIC
      description: >
        Any circle member. Returns make names from the backend vPIC port
        (cached). Clients must not call NHTSA directly. Never includes VIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Makes list (may be empty if vPIC soft-failed)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleMake"
              example:
                - name: HONDA
                - name: TOYOTA
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/models:
    get:
      operationId: listGarageModels
      tags: [family]
      summary: List vehicle models for a make and year from server-side vPIC
      description: >
        Any circle member. Year must be 1996 through the current UTC calendar
        year plus one. Soft-fail returns an empty list, not 5xx. Never
        includes VIN.
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 1996
        - name: make
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 140
      responses:
        "200":
          description: Models list (may be empty if vPIC soft-failed)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleModel"
              example:
                - name: Odyssey
                - name: Civic
        "400":
          description: Invalid request (blank make, or year outside 1996–current UTC year + 1)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/suggest-seats:
    post:
      operationId: suggestGarageSeats
      tags: [family]
      summary: Suggest seating capacity for year, make, and model
      description: >
        Any circle member. Looks up a seat hint from server-side vPIC by
        year, make, and model (the port may decode internally; clients never
        send a VIN). Returns 200 with nullable `seats` — null on miss,
        timeout, or incomplete decode (soft-fail; never 4xx/5xx for a miss).
        Hint does not create or update a vehicle.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestSeatsRequest"
            example:
              year: 2019
              make: HONDA
              model: Odyssey
      responses:
        "200":
          description: Hint finished (`seats` may be null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestSeatsResponse"
              example:
                seats: 8
        "400":
          description: Invalid request (blank make/model, or year outside range)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/vehicles:
    post:
      operationId: addVehicle
      tags: [family]
      summary: Add a vehicle owned by the current adult
      description: >
        Caller becomes owner (only they may later edit or delete). Required
        `label` (unique per owner in the circle, case-insensitive), `year`
        (1996–current UTC year + 1), `make`, `model`, and `seats` (2–18,
        total including the driver). `driverAdultIds` defaults to `[owner]`;
        if sent, must include the owner and only current circle members.
        Optional `keptAtPlaceId` defaults to the creator's default leave-from
        when set. Same place does not auto-add drivers. No VIN. Client
        `seats` is kept even when a vPIC hint differs; `suggestedSeats` on
        the response is the last hint only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleRequest"
            example:
              label: Blue van
              year: 2019
              make: HONDA
              model: Odyssey
              seats: 8
              driverAdultIds:
                - 01900000-0000-7000-8000-000000000001
              keptAtPlaceId: 01900000-0000-7000-8000-000000000031
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: >
            Invalid request (blank label, missing make/model, year outside
            range, seats outside 2–18, driver list missing owner or
            non-member, or kept-at place not in this circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Adult has no family circle yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vehicle label already exists for this owner (case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/vehicles/{vehicleId}:
    parameters:
      - name: vehicleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateVehicle
      tags: [family]
      summary: Update a vehicle the current adult owns
      description: >
        Owner only. Non-owner (including a listed driver) and Organizer
        editing someone else's car → 404. Same validation as create. Omitting
        `driverAdultIds` leaves the current driver list unchanged; sending it
        replaces it (must still include the owner). Passing null
        `keptAtPlaceId` clears the place. Does not overwrite `seats` from a
        vPIC hint. No VIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleRequest"
            example:
              label: Blue van
              year: 2019
              make: HONDA
              model: Odyssey
              seats: 7
              driverAdultIds:
                - 01900000-0000-7000-8000-000000000001
                - 01900000-0000-7000-8000-000000000002
              keptAtPlaceId: 01900000-0000-7000-8000-000000000031
      responses:
        "200":
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "400":
          description: >
            Invalid request (blank label, missing make/model, year outside
            range, seats outside 2–18, driver list missing owner or
            non-member, or kept-at place not in this circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found, not owned by the caller, or no circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vehicle label already exists for this owner (case-insensitive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteVehicle
      tags: [family]
      summary: Delete a vehicle the current adult owns
      description: >
        Owner only. Non-owner (including a listed driver) → 404. Hard delete.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Vehicle removed
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found, not owned by the caller, or no circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/garage/vehicles/{vehicleId}/suggest-seats:
    post:
      operationId: suggestVehicleSeats
      tags: [family]
      summary: Retry a seat hint for a saved vehicle
      description: >
        Any circle member. Returns the vPIC hint for the vehicle's year,
        make, and model (nullable `seats` on miss; never 4xx/5xx for a miss).
        Does **not** overwrite the vehicle's `seats`; the owner must PUT to
        change capacity. If the caller is the owner and a hint is found,
        `suggestedSeats` on the stored vehicle is updated. Clients never send
        a VIN.
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hint finished (`seats` may be null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestSeatsResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not in this circle, or adult has no circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/default-leave-from:
    patch:
      operationId: setDefaultLeaveFrom
      tags: [family]
      summary: Set or clear the current adult's default leave-from place
      description: >
        Any circle member. Sets the caller's default leave-from place for the
        circle (used when no per-item override exists). Pass null for placeId to
        clear. The place must belong to the adult's circle and must be located
        (non-null latitude/longitude); an unlocated place returns 400. Unknown
        place or place in another circle returns 404. Adults without a circle
        receive 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultLeaveFromRequest"
            example:
              placeId: 01900000-0000-7000-8000-000000000031
      responses:
        "200":
          description: Default leave-from updated; returns the circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyCircle"
        "400":
          description: Place exists but is not located (null latitude/longitude)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle, or unknown place not in the adult's circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/feeds:
    get:
      operationId: listActivityFeeds
      tags: [family]
      summary: List activity feeds for the current adult's circle
      description: >
        Any circle member may list feeds. Caregivers see the same feed metadata
        as Organizers (including last sync status) but cannot mutate feeds.
        `lastSyncedAt` / `lastSyncError` / `eventCount` reflect the latest sync
        attempt from Sync now, create/URL-change auto-sync, or the server-side
        background poller — re-GET this list to refresh status (no separate
        poll endpoint). Returns an empty array when the circle has no feeds.
        Adults without a circle receive 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Feeds for the circle (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityFeed"
              example:
                - id: 01900000-0000-7000-8000-000000000041
                  name: Soccer - Crossbar
                  sourceUrl: https://example.com/team.ics
                  kidIds:
                    - 01900000-0000-7000-8000-000000000021
                  lastSyncedAt: "2026-08-10T12:00:00Z"
                  lastSyncError: null
                  eventCount: 12
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createActivityFeed
      tags: [family]
      summary: Create an activity feed and sync immediately
      description: >
        Organizer-only. Creates a feed subscription for an iCal or webcal URL
        (`webcal://` is normalized to `https://`), associates zero or more kids
        in the circle, and runs an immediate sync. Sync soft-fails: create still
        returns 201 with lastSyncError set and eventCount 0 when fetch/parse
        fails. Duplicate normalized source URL in the same circle returns 409.
        Unknown kid ids return 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateActivityFeedRequest"
            example:
              name: Soccer - Crossbar
              sourceUrl: https://example.com/team.ics
              kidIds:
                - 01900000-0000-7000-8000-000000000021
      responses:
        "201":
          description: Feed created (sync may have soft-failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeed"
        "400":
          description: Validation failed (blank fields, invalid URL, or kid not in circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Organizer of the circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another feed in this circle already uses this source URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/feeds/{feedId}:
    put:
      operationId: updateActivityFeed
      tags: [family]
      summary: Update an activity feed
      description: >
        Organizer-only. Updates name, source URL, and/or kid associations.
        Changing the source URL triggers an immediate sync (soft-fail preserved
        on the feed). Duplicate normalized URL returns 409. Unknown kid ids
        return 400. Unknown feed id returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: feedId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActivityFeedRequest"
            example:
              name: Soccer - Updated
              sourceUrl: https://example.com/team.ics
              kidIds:
                - 01900000-0000-7000-8000-000000000021
      responses:
        "200":
          description: Feed updated (URL-change sync may have soft-failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeed"
        "400":
          description: Validation failed (blank fields, invalid URL, or kid not in circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Organizer of the circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feed not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another feed in this circle already uses this source URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteActivityFeed
      tags: [family]
      summary: Delete an activity feed and its synced events
      description: >
        Organizer-only. Removes the feed, kid associations, and stored event
        snapshot. Unknown feed id returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: feedId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Feed removed
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Organizer of the circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feed not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/feeds/{feedId}/sync:
    post:
      operationId: syncActivityFeed
      tags: [family]
      summary: Sync an activity feed now
      description: >
        Organizer-only. Fetches and parses the feed URL, replaces the stored
        event snapshot on success (UID-keyed), and always returns 200 with
        updated lastSyncedAt / lastSyncError / eventCount. Soft-fail never
        returns 5xx for vendor/fetch/parse errors. Unknown feed id returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: feedId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sync attempt finished (may have soft-failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityFeed"
              example:
                id: 01900000-0000-7000-8000-000000000041
                name: Soccer - Crossbar
                sourceUrl: https://example.com/team.ics
                kidIds:
                  - 01900000-0000-7000-8000-000000000021
                lastSyncedAt: "2026-08-10T12:05:00Z"
                lastSyncError: null
                eventCount: 12
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Organizer of the circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Feed not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar:
    get:
      operationId: listCircleCalendar
      tags: [family]
      summary: List unified calendar items (feed + manual) in a time window
      description: >
        Any circle member. Returns feed-imported and manual events whose
        startsAt falls in the half-open interval [from, to), ordered by
        startsAt ascending, then source, then id. Feed items include feedId /
        feedName and kidIds from the feed; manual items omit feed fields.
        Each item is enriched for the **current adult** with leave-from
        (database only). This list does **not** call Nominatim or OSRM.
        leaveByStatus is UNAVAILABLE when origin or destination text is missing
        (NO_ORIGIN / NO_DESTINATION), OK when destination geocode and driving
        duration are already in server caches (computed in-process; still an
        estimate — never live traffic), and PENDING when a live geocode or
        OSRM lookup is still required. Clients must GET
        /api/family/circle/calendar/leave-by to fill PENDING rows. Each item
        also includes coverage assignments for the circle (all members'
        assignments on that item), per-kid rsvps (YES / NO / NO_RESPONSE;
        missing row materializes as NO_RESPONSE), uncoveredKidIds (in-play
        kids — YES or NO_RESPONSE — not covered by any active PENDING or
        CONFIRMED assignment; RSVP NO kids are never uncovered), and conflicts
        (server-computed kid time-overlaps ignore RSVP NO kids; adult coverage
        overlaps using event startsAt/endsAt only; peers may lie outside the
        requested window). Empty array when none match. from must be strictly
        before to (400 otherwise). Adults without a circle receive 404. Does
        not mutate feed snapshots or manual events.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive window start (UTC instant)
          schema:
            type: string
            format: date-time
          example: "2026-08-01T00:00:00Z"
        - name: to
          in: query
          required: true
          description: Exclusive window end (UTC instant)
          schema:
            type: string
            format: date-time
          example: "2026-09-01T00:00:00Z"
      responses:
        "200":
          description: Calendar items in the window (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarItem"
              example:
                - id: 01900000-0000-7000-8000-000000000051
                  source: MANUAL
                  title: Dentist
                  startsAt: "2026-08-15T16:00:00Z"
                  endsAt: null
                  location: Clinic
                  kidIds:
                    - 01900000-0000-7000-8000-000000000021
                  feedId: null
                  feedName: null
                  leaveFromPlaceId: 01900000-0000-7000-8000-000000000031
                  leaveFromPlaceName: Mom's house
                  leaveByAt: null
                  leaveByStatus: PENDING
                  leaveByReason: null
                  coverages:
                    - id: 01900000-0000-7000-8000-000000000071
                      coveringAdultId: 01900000-0000-7000-8000-000000000001
                      coveringAdultDisplayName: Alex
                      assignedByAdultId: 01900000-0000-7000-8000-000000000002
                      kidIds:
                        - 01900000-0000-7000-8000-000000000021
                      status: CONFIRMED
                  uncoveredKidIds: []
                  conflicts: []
                  rsvps:
                    - kidId: 01900000-0000-7000-8000-000000000021
                      status: YES
                - id: 01900000-0000-7000-8000-000000000061
                  source: FEED
                  title: Practice
                  startsAt: "2026-08-15T17:00:00Z"
                  endsAt: "2026-08-15T18:00:00Z"
                  location: Field 3
                  kidIds:
                    - 01900000-0000-7000-8000-000000000021
                  feedId: 01900000-0000-7000-8000-000000000041
                  feedName: U12
                  leaveFromPlaceId: null
                  leaveFromPlaceName: null
                  leaveByAt: null
                  leaveByStatus: UNAVAILABLE
                  leaveByReason: NO_ORIGIN
                  coverages: []
                  uncoveredKidIds:
                    - 01900000-0000-7000-8000-000000000021
                  conflicts:
                    - type: KID_TIME_OVERLAP
                      kidId: 01900000-0000-7000-8000-000000000021
                      adultId: null
                      adultDisplayName: null
                      otherSource: MANUAL
                      otherItemId: 01900000-0000-7000-8000-000000000051
                      otherTitle: Dentist
                      otherStartsAt: "2026-08-15T16:00:00Z"
                  rsvps:
                    - kidId: 01900000-0000-7000-8000-000000000021
                      status: NO_RESPONSE
        "400":
          description: Missing from/to, or from is not strictly before to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/leave-by:
    get:
      operationId: listCalendarLeaveBy
      tags: [family]
      summary: Fill estimated leave-by for calendar items in a time window
      description: >
        Any circle member. Returns leave-by enrichment for feed-imported and
        manual events whose startsAt falls in the half-open interval [from, to).
        Uses cached destination geocodes and driving durations when present;
        otherwise may call Nominatim and OSRM. Duplicate locations and origin+
        dest pairs in the window share one upstream lookup. Successful geocodes
        and OSRM durations are persisted; misses, OSRM failures, and the
        fallback duration are not. leaveByStatus is OK or UNAVAILABLE (never
        PENDING). Leave-by is always an estimate — never live traffic. Empty
        array when none match. from must be strictly before to (400 otherwise).
        Adults without a circle receive 404. Does not mutate feed snapshots or
        manual events.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive window start (UTC instant)
          schema:
            type: string
            format: date-time
          example: "2026-08-01T00:00:00Z"
        - name: to
          in: query
          required: true
          description: Exclusive window end (UTC instant)
          schema:
            type: string
            format: date-time
          example: "2026-09-01T00:00:00Z"
      responses:
        "200":
          description: Leave-by rows in the window (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarLeaveBy"
              example:
                - id: 01900000-0000-7000-8000-000000000051
                  source: MANUAL
                  leaveFromPlaceId: 01900000-0000-7000-8000-000000000031
                  leaveFromPlaceName: Mom's house
                  leaveByAt: "2026-08-15T15:25:00Z"
                  leaveByStatus: OK
                  leaveByReason: null
                - id: 01900000-0000-7000-8000-000000000061
                  source: FEED
                  leaveFromPlaceId: null
                  leaveFromPlaceName: null
                  leaveByAt: null
                  leaveByStatus: UNAVAILABLE
                  leaveByReason: NO_ORIGIN
        "400":
          description: Missing from/to, or from is not strictly before to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/{source}/{itemId}/leave-from:
    put:
      operationId: setCalendarLeaveFrom
      tags: [family]
      summary: Set the current adult's leave-from place for a calendar item
      description: >
        Any circle member. Stores a per-adult leave-from place override for the
        given calendar item (MANUAL or FEED). The place must belong to the
        adult's circle and must be located (non-null latitude/longitude); an
        unlocated place returns 400. Unknown item id for the given source,
        unknown place, or place in another circle returns 404. Adults without
        a circle receive 404. Returns the calendar item fully enriched with
        leave-by for the current adult (OK or UNAVAILABLE; may call Nominatim
        or OSRM for this one row). Distinct from listCircleCalendar, which does
        not perform live routing. Does not
        mutate the underlying manual event or feed snapshot.
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: path
          required: true
          description: Whether the item is a manual event or a feed-imported row
          schema:
            $ref: "#/components/schemas/CalendarItemSource"
        - name: itemId
          in: path
          required: true
          description: Manual event id or feed event id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCalendarLeaveFromRequest"
            example:
              leaveFromPlaceId: 01900000-0000-7000-8000-000000000031
      responses:
        "200":
          description: Leave-from saved; item returned with leave-by for this adult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "400":
          description: >
            Missing leaveFromPlaceId, or place exists but is not located
            (null latitude/longitude)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            No circle, unknown calendar item for source, unknown place, or
            place not in the adult's circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/{source}/{itemId}/rsvps/{kidId}:
    parameters:
      - name: source
        in: path
        required: true
        description: Whether the item is a manual event or a feed-imported row
        schema:
          $ref: "#/components/schemas/CalendarItemSource"
      - name: itemId
        in: path
        required: true
        description: Manual event id or feed event id
        schema:
          type: string
          format: uuid
      - name: kidId
        in: path
        required: true
        description: Kid on the calendar item whose RSVP is being set
        schema:
          type: string
          format: uuid
    put:
      operationId: setCalendarRsvp
      tags: [family]
      summary: Set per-kid RSVP on a calendar item
      description: >
        Any circle member. Sets attendance for one kid on the item to YES, NO,
        or NO_RESPONSE. Missing rows read as NO_RESPONSE; setting NO_RESPONSE
        deletes any stored row. Setting NO or NO_RESPONSE while the kid is on
        an active (PENDING or CONFIRMED) coverage assignment hard-releases that
        kid from the assignment (deletes the row if empty). Kid not on the
        item returns 400. Unknown item id for the given source returns 404.
        Returns the enriched calendar item (including rsvps and updated
        coverages / uncoveredKidIds).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCalendarRsvpRequest"
            example:
              status: NO
      responses:
        "200":
          description: RSVP updated; calendar item returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "400":
          description: Kid is not on the calendar item, or status is missing/invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle or unknown calendar item for source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/{source}/{itemId}/coverages:
    parameters:
      - name: source
        in: path
        required: true
        description: Whether the item is a manual event or a feed-imported row
        schema:
          $ref: "#/components/schemas/CalendarItemSource"
      - name: itemId
        in: path
        required: true
        description: Manual event id or feed event id
        schema:
          type: string
          format: uuid
    post:
      operationId: assignCalendarCoverage
      tags: [family]
      summary: Assign coverage responsibility for kids on a calendar item
      description: >
        Any circle member. Creates a coverage assignment naming a covering adult
        and one or more kids on the calendar item. Self-assignment auto-confirms;
        assigning another adult creates a PENDING assignment they must confirm or
        decline. Successfully assigned kids are set to RSVP YES. A kid with RSVP
        NO cannot be assigned (400). Empty kidIds, kids not on the item, or kid
        already covered by another active (PENDING or CONFIRMED) assignment
        returns 400 or 409. Self-assign (auto-CONFIRMED) that would leave the
        adult with two CONFIRMED coverages on overlapping events also returns
        409. Unknown item id for the given source returns 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCalendarCoverageRequest"
            example:
              coveringAdultId: 01900000-0000-7000-8000-000000000002
              kidIds:
                - 01900000-0000-7000-8000-000000000021
      responses:
        "201":
          description: Coverage assigned; calendar item returned with updated coverages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "400":
          description: >
            Empty kidIds, kid not on the calendar item, or kid RSVP is NO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle or unknown calendar item for source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Kid already covered by another active assignment, or self-assign
            would create overlapping CONFIRMED coverages for the adult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/coverages/{assignmentId}:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: reassignCalendarCoverage
      tags: [family]
      summary: Reassign an existing coverage assignment
      description: >
        Any circle member. Updates the covering adult and/or kid list on an
        existing assignment. Same validation as assign (empty kidIds, kid not on
        item, kid conflict, kid RSVP NO → 400). Successfully reassigned kids are
        set to RSVP YES. Reassign that auto-CONFIRMs (self) and would create
        overlapping CONFIRMED coverages for that adult returns 409. Unknown
        assignment id returns 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCalendarCoverageRequest"
      responses:
        "200":
          description: Coverage reassigned; calendar item returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "400":
          description: >
            Empty kidIds, kid not on the calendar item, or kid RSVP is NO
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle or unknown assignment id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Kid already covered by another active assignment, or reassign that
            auto-CONFIRMs would create overlapping CONFIRMED coverages for the
            adult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: removeCalendarCoverage
      tags: [family]
      summary: Remove a coverage assignment
      description: >
        Any circle member. Deletes the assignment. RSVP statuses are unchanged.
        Removing a CONFIRMED assignment on a feed event also withdraws, in the
        same transaction, every ACCEPTED inbound carpool ride on that event
        where the caller's circle is the accepting circle (rides return to
        PENDING). PENDING or MANUAL assignments have no carpool side effect.
        Unknown assignment id returns 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignment removed; calendar item returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle or unknown assignment id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/coverages/{assignmentId}/confirm:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmCalendarCoverage
      tags: [family]
      summary: Confirm a pending coverage assignment
      description: >
        The covering adult named on the assignment only. Sets status to
        CONFIRMED and sets RSVP YES for kids on the assignment. Non-assignee
        receives 403. Assignment must be PENDING; already confirmed or declined
        may return 409. Confirm that would leave the adult with two CONFIRMED
        coverages on overlapping events returns 409 (assignments unchanged).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignment confirmed; calendar item returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the covering adult on this assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle or unknown assignment id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Assignment is not in PENDING state, or confirm would create
            overlapping CONFIRMED coverages for the adult
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/calendar/coverages/{assignmentId}/decline:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: declineCalendarCoverage
      tags: [family]
      summary: Decline a pending coverage assignment
      description: >
        The covering adult named on the assignment only. Sets status to
        DECLINED (kids become uncovered unless reassigned). RSVP statuses are
        unchanged. Non-assignee receives 403. Assignment must be PENDING;
        already confirmed or declined may return 409.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assignment declined; calendar item returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarItem"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not the covering adult on this assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle or unknown assignment id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Assignment is not in PENDING state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/events:
    get:
      operationId: listManualEvents
      tags: [family]
      summary: List manual events for the current adult's circle
      description: >
        Any circle member may list manual (non-feed) events. Returns all events
        for the circle ordered by startsAt ascending (then id). Empty array when
        none exist. Does not include feed-imported events. Adults without a
        circle receive 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Manual events for the circle (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualEvent"
              example:
                - id: 01900000-0000-7000-8000-000000000051
                  title: Dentist
                  startsAt: "2026-08-15T17:00:00Z"
                  endsAt: "2026-08-15T18:00:00Z"
                  location: Clinic
                  kidIds:
                    - 01900000-0000-7000-8000-000000000021
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createManualEvent
      tags: [family]
      summary: Create a manual event
      description: >
        Any circle member. Creates a one-off schedule item with a required title
        and startsAt, optional endsAt and location, and one or more kids from
        the circle. Empty kidIds, kids not in the circle, blank title, or endsAt
        before startsAt return 400.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualEventRequest"
            example:
              title: Dentist
              startsAt: "2026-08-15T17:00:00Z"
              endsAt: "2026-08-15T18:00:00Z"
              location: Clinic
              kidIds:
                - 01900000-0000-7000-8000-000000000021
      responses:
        "201":
          description: Manual event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualEvent"
        "400":
          description: >
            Validation failed (blank title, missing startsAt, empty kidIds,
            kid not in circle, or endsAt before startsAt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/family/circle/events/{eventId}:
    get:
      operationId: getManualEvent
      tags: [family]
      summary: Get a manual event
      description: >
        Any circle member. Returns one manual event by id. Unknown id or other
        circle returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Manual event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualEvent"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      operationId: updateManualEvent
      tags: [family]
      summary: Update a manual event
      description: >
        Any circle member. Replaces title, startsAt, optional endsAt/location,
        and kid associations (still 1+ kids required). Same 400 rules as create.
        Unknown event id returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateManualEventRequest"
            example:
              title: Dentist (follow-up)
              startsAt: "2026-08-15T17:00:00Z"
              endsAt: null
              location: Clinic
              kidIds:
                - 01900000-0000-7000-8000-000000000021
      responses:
        "200":
          description: Manual event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualEvent"
        "400":
          description: >
            Validation failed (blank title, missing startsAt, empty kidIds,
            kid not in circle, or endsAt before startsAt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteManualEvent
      tags: [family]
      summary: Delete a manual event
      description: >
        Any circle member. Hard-deletes the event and kid links. Unknown event
        id returns 404. Does not affect feed-imported events.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Manual event removed
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Event not found in the current adult's circle (or no circle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool:
    get:
      operationId: getCarpoolSummary
      tags: [carpool]
      summary: Carpool tab summary for the current adult's circle
      description: >
        Any circle member. Returns per-feed carpool status (so Organizers can
        Enable, and any member can Request / open a space they belong to),
        spaces this circle already belongs to (invite code, member circle
        names, owner pending join requests). Does not include ride requests —
        use GET /api/carpool/spaces/{spaceId}/rides for upcoming events and
        ride overlays. Never other families' kids. Importing a feed never
        auto-joins a space. A feed with no space
        for that normalized URL has status NONE (Enable is Organizer-only on
        the client). A space that exists for a subscriber who is not a member
        has status AVAILABLE or REQUESTED — name only, no member list, invite
        code, or rides. Adults without a circle receive 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Summary for the circle (feeds and spaces may be empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolSummary"
              example:
                circleRole: ORGANIZER
                feeds:
                  - feedId: 01900000-0000-7000-8000-000000000041
                    feedName: Soccer - Crossbar
                    status: NONE
                    spaceId: null
                    spaceName: null
                spaces: []
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Current adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/enable:
    post:
      operationId: enableCarpoolSpace
      tags: [carpool]
      summary: Enable a team carpool space on a circle feed
      description: >
        Organizer-only. The circle must already have the given feed. Creates a
        space named after the feed, keyed to that feed's normalized source URL,
        marks this circle OWNER, and issues an invite code. Clients must
        confirm that this family will own the space (admit / decline requests)
        before calling. Caregiver Enable returns 403. A second Enable for the
        same normalized URL (this circle or another) returns 409 — refresh
        summary; the other circle sees AVAILABLE (Request + Have a code), not
        a second Enable.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableCarpoolSpaceRequest"
            example:
              feedId: 01900000-0000-7000-8000-000000000041
      responses:
        "201":
          description: Space created; caller circle is OWNER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolSpace"
              example:
                id: 01900000-0000-7000-8000-000000000080
                name: Soccer - Crossbar
                membership: OWNER
                inviteCode: AB12CD34
                callerFeedId: 01900000-0000-7000-8000-000000000041
                members:
                  - circleId: 01900000-0000-7000-8000-000000000010
                    circleName: McCarthy house
                    membership: OWNER
                pendingRequests: []
        "400":
          description: Invalid request (e.g. missing feedId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is a Caregiver (Organizer-only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No circle, or feedId is not a feed in the caller's circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A space already exists for this feed's normalized URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/join:
    post:
      operationId: joinCarpoolSpace
      tags: [carpool]
      summary: Join a team carpool space with an invite code
      description: >
        Signed-in adult with a family circle. Invalid or regenerated-away codes
        return 404 (no existence leak). Already a member (OWNER or MEMBER)
        returns 409. Otherwise the circle is admitted as MEMBER immediately.
        Caregiver redeem is allowed. If the circle has no feed with that
        normalized URL, the server ensureFeed (name copied from the space,
        zero kid links, then the existing auto-sync path) — a duplicate-URL
        409 must not fire; this is join-only when the feed already exists.
        No circle yet returns 404; a carpool code does not create a household.
        Lookup is on this endpoint only (not the family invite join path).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinCarpoolSpaceRequest"
            example:
              code: AB12CD34
      responses:
        "200":
          description: Circle admitted as MEMBER (feed created if the URL was missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolSpace"
        "400":
          description: Invalid request (e.g. blank code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invite code unknown or no longer valid, or adult has no family circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Caller's circle is already a member of this space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCarpoolSpace
      tags: [carpool]
      summary: Get a team carpool space the circle belongs to
      description: >
        Any adult in a member circle (OWNER or MEMBER). Includes the current
        invite code (any member may view/copy), member circle names (not
        other families' kids), and pending join requests when the caller
        circle is OWNER. Non-member GET — including a same-URL subscriber
        who only sees AVAILABLE — returns 404 (no existence leak of members
        or the code).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Space detail for a member circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolSpace"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/invite/regenerate:
    post:
      operationId: regenerateCarpoolInvite
      tags: [carpool]
      summary: Regenerate the space invite code
      description: >
        Owning-circle adults only (any role in that circle). Replaces the
        active invite code; the previous code no longer accepts joins. No
        TTL. Member-but-not-owner returns 403. Non-member returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: New invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolInvite"
              example:
                code: XY98ZW76
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller's circle is a member but not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/leave:
    post:
      operationId: leaveCarpoolSpace
      tags: [carpool]
      summary: Leave a team carpool space
      description: >
        Acts for the whole household. A MEMBER circle may leave anytime.
        The OWNER circle may leave only if it is the only member circle —
        the space is then removed (that URL may be Enabled again). Owner
        leave while other member circles remain returns 409. Non-member
        returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Left the space (sole-owner leave also deletes the space)
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Owner cannot leave while other member circles remain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/requests:
    post:
      operationId: createCarpoolJoinRequest
      tags: [carpool]
      summary: Request to join a team carpool space
      description: >
        Caller's circle must already have a feed with this space's normalized
        URL, must not be a member, and the space must exist (summary status
        AVAILABLE). Creates a PENDING request; owner-circle adults see it
        in-app (circle name + requester display name) — no email/push.
        Duplicate PENDING from the same circle returns 409. Already a member
        returns 409. Circle lacks the matching feed, or unknown space,
        returns 404. After Decline, a new request is allowed. Caregiver
        request is allowed.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Join request created (PENDING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolJoinRequest"
              example:
                id: 01900000-0000-7000-8000-000000000090
                spaceId: 01900000-0000-7000-8000-000000000080
                circleId: 01900000-0000-7000-8000-000000000011
                circleName: The other house
                requestedByAdultId: 01900000-0000-7000-8000-000000000002
                requestedByDisplayName: Jordan
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            Unknown space, no circle, or caller's circle has no feed matching
            this space's normalized URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already a member, or a PENDING request from this circle already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/requests/{requestId}/admit:
    post:
      operationId: admitCarpoolJoinRequest
      tags: [carpool]
      summary: Admit a pending join request
      description: >
        Owning-circle adults only. The requesting circle becomes MEMBER.
        Does not add a feed — they already have the matching URL. Non-owner
        member returns 403. Non-member returns 404. Unknown request returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Requesting circle admitted as MEMBER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolSpace"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller's circle is a member but not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space or request, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/requests/{requestId}/decline:
    post:
      operationId: declineCarpoolJoinRequest
      tags: [carpool]
      summary: Decline a pending join request
      description: >
        Owning-circle adults only. Closes the request; the requesting circle
        may request again. Non-owner member returns 403. Non-member or
        unknown request returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Request declined (they may request again)
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller's circle is a member but not the owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space or request, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/rides:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listCarpoolRides
      tags: [carpool]
      summary: List upcoming feed events with ride overlays for a space
      description: >
        Any adult in a member circle. Returns feed events on this space's
        normalized URL whose startsAt falls in the half-open interval [from, to),
        ordered by startsAt ascending. Manual events are excluded. Each row
        includes event identity (iCal UID when present, else a title/start/
        location fingerprint), title, start/end, defaultKidIds (this circle's
        feed-linked kids who are not RSVP NO and still need a ride —
        YES and NO_RESPONSE both qualify; for Request pre-fill), this
        circle's active ride request if any (PENDING or ACCEPTED), and other
        member circles' PENDING/ACCEPTED requests (circle name, kid first
        names, seat count, pickup name+address, passedByAdultNames). Passed
        asks remain in otherRequests with passedByMe true for the calling
        adult (still PENDING for everyone else). Pass is a soft decline:
        non-Focus surfaces may still offer Accept while the ride is PENDING;
        Focus ranking/CTAs may skip asks the caller has passed. Empty array
        when no upcoming feed events match. from must be strictly before to
        and the window must not exceed 31 days (400 otherwise). Non-member or
        unknown space returns 404.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive window start (UTC instant)
          schema:
            type: string
            format: date-time
          example: "2026-08-01T00:00:00Z"
        - name: to
          in: query
          required: true
          description: Exclusive window end (UTC instant)
          schema:
            type: string
            format: date-time
          example: "2026-08-31T00:00:00Z"
      responses:
        "200":
          description: Upcoming feed events with ride overlays (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarpoolRideEvent"
        "400":
          description: >
            Missing from/to, from is not strictly before to, or window exceeds
            31 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCarpoolRide
      tags: [carpool]
      summary: Request a ride for a feed event
      description: >
        Any space-member adult. Creates a PENDING ride request for both legs
        with pickup at the requester's house (default leave-from place if set,
        else the circle's first named place with a non-blank address). Snapshots
        kid first names and pickup name+address at create. When kidIds is
        omitted, defaults to all feed-linked kids on that event who are not
        RSVP NO and not already on this circle's ACCEPTED ride
        (YES and NO_RESPONSE both qualify; stable order = feed kid link order);
        when present, must be a non-empty subset of that set.
        Create does not change RSVP (requested kids may remain NO_RESPONSE).
        Empty default set (no feed kids, or all RSVP NO / already covered),
        unknown kids, RSVP NO in kidIds, kid already on an ACCEPTED ride, or
        no pickup address returns 400. Duplicate active (PENDING or ACCEPTED)
        request from this circle for the same event returns 409. Caregiver
        create is allowed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarpoolRideRequest"
      responses:
        "201":
          description: Ride request created (PENDING)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolRide"
        "400":
          description: >
            Invalid kids (including RSVP NO), no pickup address, or empty
            default kid set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space, or caller's circle is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            An active ride request from this circle already exists for this
            event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/rides/{rideId}/accept:
    post:
      operationId: acceptCarpoolRide
      tags: [carpool]
      summary: Accept another circle's pending ride request
      description: >
        Space-member adult with drives=true who is in the chosen vehicle's
        driverAdultIds, and whose circle is not the requesting circle. Accept
        is all-or-nothing when remaining vehicle seats (including driver and
        this circle's RSVP YES kids on the event) are at least the request's
        seat count, and this vehicle has no other ACCEPTED ride for the event.
        Success sets ACCEPTED, records accepter, circle, and vehicle, clears
        pass rows, and sets RSVP YES for the requesting circle's kids on that
        ride. Allowed even when the caller previously passed (passedByMe).
        Cancel, Withdraw, and Pass do not auto-change RSVP. Own circle's
        request returns 409. drives=false returns 403. Unknown or not allowed
        vehicle returns 404. Not enough seats, vehicle already committed, or
        ride not PENDING returns 409.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptCarpoolRideRequest"
      responses:
        "200":
          description: Ride request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolRide"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller has drives=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >
            Unknown space, ride, or vehicle, caller not a member, or vehicle
            not drivable by caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Own-circle request, not PENDING, not enough seats, or vehicle
            already has an ACCEPTED ride for this event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/rides/{rideId}/pass:
    post:
      operationId: passCarpoolRide
      tags: [carpool]
      summary: Pass on another circle's pending ride request
      description: >
        Space-member adult whose circle is not the requesting circle. Soft
        decline: records that this adult is not taking this PENDING ask right
        now; the request stays PENDING for everyone else and Accept remains
        allowed while PENDING (Focus clients may skip passed asks). drives /
        vehicle eligibility is not required. Empty body. Own circle's request
        returns 409. Ride not PENDING returns 409. Non-member or unknown ride
        returns 404. Second pass by the same adult is idempotent (200, no-op).
        Passes are cleared when the ride is Cancelled or Accepted; they
        survive Withdraw back to PENDING. No un-pass in this revision. The
        200 body includes passedByAdultNames for the ride.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pass recorded (or already recorded); ride remains PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolRide"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space or ride, or caller not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Own-circle request, or ride is not PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/rides/{rideId}/cancel:
    post:
      operationId: cancelCarpoolRide
      tags: [carpool]
      summary: Cancel a ride request from the requesting circle
      description: >
        Any adult in the requesting circle. Transitions PENDING or ACCEPTED to
        CANCELLED; an accepted cancel frees the vehicle. Wrong circle returns
        403. Non-member or unknown ride returns 404. Already CANCELLED or
        invalid transition returns 409.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ride request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolRide"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller's circle is not the requesting circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space or ride, or caller not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ride is not PENDING or ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/carpool/spaces/{spaceId}/rides/{rideId}/withdraw:
    post:
      operationId: withdrawCarpoolRide
      tags: [carpool]
      summary: Withdraw an acceptance from the accepting circle
      description: >
        Any adult in the accepting circle. Transitions ACCEPTED to PENDING and
        clears accepter and vehicle fields. Wrong circle returns 403.
        Non-member or unknown ride returns 404. Not ACCEPTED returns 409.
      security:
        - bearerAuth: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Acceptance withdrawn; ride is PENDING again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarpoolRide"
        "401":
          description: Missing, invalid, or revoked Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller's circle is not the accepting circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown space or ride, or caller not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Ride is not ACCEPTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        Opaque session token returned by verifyAuthCode. Send as
        `Authorization: Bearer <accessToken>`.

  schemas:
    RequestAuthCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Adult email (server normalizes trim + lowercase)
          example: parent@example.com

    RequestAuthCodeResponse:
      type: object
      required:
        - email
        - expiresInSeconds
      properties:
        email:
          type: string
          format: email
          example: parent@example.com
        expiresInSeconds:
          type: integer
          minimum: 1
          description: Seconds until the issued code expires
          example: 600
        devCode:
          type: string
          description: >
            Plaintext OTP present only when explicit dev code-echo is enabled.
            Must be omitted in production-shaped configuration.
          example: "123456"

    VerifyAuthCodeRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: parent@example.com
        code:
          type: string
          minLength: 4
          maxLength: 12
          description: One-time code from email (typically 6 digits)
          example: "123456"

    AuthSessionResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - adult
      properties:
        accessToken:
          type: string
          description: Opaque Bearer session token
        tokenType:
          type: string
          enum: [Bearer]
          example: Bearer
        adult:
          $ref: "#/components/schemas/Adult"

    Adult:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: Stable adult identifier
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
          description: >
            Null until set when creating or joining a family circle (or later
            profile flows). May be non-null after createFamilyCircle or
            joinFamilyCircle.

    CreateFamilyCircleRequest:
      type: object
      required:
        - adultDisplayName
      properties:
        adultDisplayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Required display name for the creating adult
          example: Alex
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 80
          description: Optional circle name; omit or null for unnamed ("Your family")
          example: McCarthy house

    UpdateFamilyCircleRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
          maxLength: 80
          description: >
            New circle name. Null clears the name so clients show "Your family".
          example: Our house

    FamilyCircle:
      type: object
      required:
        - id
        - role
        - members
        - kids
        - places
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
          description: Null when unnamed; clients should show "Your family"
        role:
          $ref: "#/components/schemas/FamilyRole"
          description: Caller's role in this circle
        members:
          type: array
          items:
            $ref: "#/components/schemas/FamilyMember"
        kids:
          type: array
          items:
            $ref: "#/components/schemas/Kid"
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        defaultLeaveFromPlaceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Caller's default leave-from place for this circle (used when no
            per-item override). Null when unset.
        defaultLeaveFromPlaceName:
          type: string
          nullable: true
          description: Display name of defaultLeaveFromPlaceId when set
          example: Mom's house

    FamilyMember:
      type: object
      required:
        - adultId
        - email
        - role
      properties:
        adultId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/FamilyRole"

    FamilyInvite:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 16
          description: >
            Human-shareable invite code for the circle. Case-insensitive on
            accept; one active code per circle until regenerated.
          example: AB12CD34

    JoinFamilyCircleRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
          description: Invite code from an Organizer
          example: AB12CD34
        adultDisplayName:
          type: string
          minLength: 1
          maxLength: 80
          description: >
            Required when the joining adult's displayName is still null;
            ignored or may refresh when already set (server may require it only
            when null).
          example: Jordan

    UpdateFamilyMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/FamilyRole"

    FamilyRole:
      type: string
      enum: [ORGANIZER, CAREGIVER]
      description: >
        ORGANIZER can invite (view/regenerate code), manage members/roles, rename
        the circle, and manage kids. CAREGIVER can read the circle and leave.
        Any member may manage named places and retry locate. Join always creates
        CAREGIVER; promote/demote adjusts roles with ≥1 Organizer required.

    Kid:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
          format: uuid
          description: Stable kid identifier
        displayName:
          type: string
          minLength: 1
          maxLength: 80

    CreateKidRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          example: Sam

    UpdateKidRequest:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
          example: Samantha

    Place:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
          format: uuid
          description: Stable place identifier
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: >
            Short label unique within the circle (trim + case-insensitive).
          example: Mom's house
        address:
          type: string
          minLength: 1
          maxLength: 255
          description: Free-text address used for geocoding
          example: 123 Main St
        latitude:
          type: number
          format: double
          nullable: true
          description: >
            WGS84 latitude when geocoding succeeded; null when not located
            (soft-fail or not yet resolved).
          example: 40.7128
        longitude:
          type: number
          format: double
          nullable: true
          description: >
            WGS84 longitude when geocoding succeeded; null when not located
            (soft-fail or not yet resolved).
          example: -74.006

    CreatePlaceRequest:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Mom's house
        address:
          type: string
          minLength: 1
          maxLength: 255
          example: 123 Main St

    UpdatePlaceRequest:
      type: object
      required:
        - name
        - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Mom's house
        address:
          type: string
          minLength: 1
          maxLength: 255
          example: 456 Oak Ave

    Garage:
      type: object
      required:
        - members
        - vehicles
      properties:
        members:
          type: array
          description: Every circle member's `drives` flag (default true)
          items:
            $ref: "#/components/schemas/GarageMemberDrives"
        vehicles:
          type: array
          description: >
            Flat list of circle vehicles (not nested under the owner). Each
            row includes who owns it and who may drive it.
          items:
            $ref: "#/components/schemas/Vehicle"

    GarageMemberDrives:
      type: object
      required:
        - adultId
        - displayName
        - drives
      properties:
        adultId:
          type: string
          format: uuid
        displayName:
          type: string
          example: Alex
        drives:
          type: boolean
          description: >
            False means this adult does not drive. Does not change role or
            delete vehicles.
          example: true

    Vehicle:
      type: object
      required:
        - id
        - ownerAdultId
        - driverAdultIds
        - label
        - year
        - make
        - model
        - seats
      properties:
        id:
          type: string
          format: uuid
          description: Stable vehicle identifier
        ownerAdultId:
          type: string
          format: uuid
          description: Creator; only they may edit or delete
        driverAdultIds:
          type: array
          minItems: 1
          description: >
            Circle members allowed to take this car. Always includes the
            owner. Same named place does not imply membership on this list.
          items:
            type: string
            format: uuid
        keptAtPlaceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional named place where the car lives (grouping only). Does
            not grant driving rights.
        label:
          type: string
          minLength: 1
          maxLength: 80
          description: Nickname unique per owner in the circle (case-insensitive)
          example: Blue van
        year:
          type: integer
          minimum: 1996
          description: Model year; 1996 through the current UTC calendar year plus one
          example: 2019
        make:
          type: string
          minLength: 1
          maxLength: 140
          description: vPIC make name from the garage makes list (no VIN)
          example: HONDA
        model:
          type: string
          minLength: 1
          maxLength: 140
          description: vPIC model name from the garage models list for that make+year (no VIN)
          example: Odyssey
        seats:
          type: integer
          minimum: 2
          maximum: 18
          description: >
            Total seating capacity **including the driver**. Source of truth;
            always overridable. A vPIC hint never overwrites this unless the
            client sends the new value.
          example: 8
        suggestedSeats:
          type: integer
          minimum: 2
          maximum: 18
          nullable: true
          description: Last vPIC seat hint; null when no hint is stored

    CreateVehicleRequest:
      type: object
      required:
        - label
        - year
        - make
        - model
        - seats
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
          example: Blue van
        year:
          type: integer
          minimum: 1996
          example: 2019
        make:
          type: string
          minLength: 1
          maxLength: 140
          example: HONDA
        model:
          type: string
          minLength: 1
          maxLength: 140
          example: Odyssey
        seats:
          type: integer
          minimum: 2
          maximum: 18
          description: Total seating capacity including the driver
          example: 8
        driverAdultIds:
          type: array
          description: >
            Defaults to `[owner]` when omitted or empty. Must include the
            owner; all ids must be current circle members.
          items:
            type: string
            format: uuid
        keptAtPlaceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional circle named place. When omitted on create, defaults to
            the creator's default leave-from if set.

    UpdateVehicleRequest:
      type: object
      required:
        - label
        - year
        - make
        - model
        - seats
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
          example: Blue van
        year:
          type: integer
          minimum: 1996
          example: 2019
        make:
          type: string
          minLength: 1
          maxLength: 140
          example: HONDA
        model:
          type: string
          minLength: 1
          maxLength: 140
          example: Odyssey
        seats:
          type: integer
          minimum: 2
          maximum: 18
          description: Total seating capacity including the driver
          example: 7
        driverAdultIds:
          type: array
          description: >
            When omitted, the current driver list is kept. When sent, must
            include the owner; all ids must be current circle members.
          items:
            type: string
            format: uuid
        keptAtPlaceId:
          type: string
          format: uuid
          nullable: true
          description: Optional circle named place; null clears it

    PatchGarageDrivesRequest:
      type: object
      required:
        - drives
      properties:
        drives:
          type: boolean
          description: False means the current adult does not drive
          example: false

    SuggestSeatsRequest:
      type: object
      required:
        - year
        - make
        - model
      properties:
        year:
          type: integer
          minimum: 1996
          example: 2019
        make:
          type: string
          minLength: 1
          maxLength: 140
          example: HONDA
        model:
          type: string
          minLength: 1
          maxLength: 140
          example: Odyssey

    SuggestSeatsResponse:
      type: object
      properties:
        seats:
          type: integer
          minimum: 2
          maximum: 18
          nullable: true
          description: >
            vPIC hint for total seats including the driver; null on miss.
            Never a VIN.

    VehicleMake:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: HONDA

    VehicleModel:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Odyssey

    ActivityFeed:
      type: object
      required:
        - id
        - name
        - sourceUrl
        - kidIds
        - eventCount
      properties:
        id:
          type: string
          format: uuid
          description: Stable feed identifier
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Organizer-chosen label for the feed
          example: Soccer - Crossbar
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 2048
          description: >
            iCal or webcal subscription URL. Server normalizes `webcal://` to
            `https://` for fetch and duplicate checks.
          example: https://example.com/team.ics
        kidIds:
          type: array
          description: Kids in this circle associated with the feed (may be empty)
          items:
            type: string
            format: uuid
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            When the last sync attempt finished (success or soft-fail), whether
            from Sync now, create/URL-change auto-sync, or background poll.
            Null only if no sync has been attempted yet.
          example: "2026-08-10T12:00:00Z"
        lastSyncError:
          type: string
          nullable: true
          description: >
            Soft-fail message from the last sync attempt; null when the last
            sync succeeded.
          example: null
        eventCount:
          type: integer
          minimum: 0
          description: Number of events stored from the last successful sync snapshot
          example: 12

    CreateActivityFeedRequest:
      type: object
      required:
        - name
        - sourceUrl
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Soccer - Crossbar
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 2048
          example: https://example.com/team.ics
        kidIds:
          type: array
          description: Optional kid associations (defaults to empty)
          items:
            type: string
            format: uuid

    UpdateActivityFeedRequest:
      type: object
      required:
        - name
        - sourceUrl
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Soccer - Updated
        sourceUrl:
          type: string
          minLength: 1
          maxLength: 2048
          example: https://example.com/team.ics
        kidIds:
          type: array
          description: Optional kid associations (defaults to empty / replace)
          items:
            type: string
            format: uuid

    ManualEvent:
      type: object
      required:
        - id
        - title
        - startsAt
        - kidIds
      properties:
        id:
          type: string
          format: uuid
          description: Stable manual event identifier
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: Event title / summary
          example: Dentist
        startsAt:
          type: string
          format: date-time
          description: Event start instant (UTC)
          example: "2026-08-15T17:00:00Z"
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional end instant (UTC). When set, must be on or after startsAt.
          example: "2026-08-15T18:00:00Z"
        location:
          type: string
          nullable: true
          maxLength: 500
          description: Optional free-text location
          example: Clinic
        kidIds:
          type: array
          minItems: 1
          description: One or more kids in this circle associated with the event
          items:
            type: string
            format: uuid

    CalendarItemSource:
      type: string
      description: Whether the calendar row came from a manual event or a synced feed
      enum:
        - MANUAL
        - FEED

    CalendarConflictType:
      type: string
      description: >
        Server-computed schedule conflict on a calendar item. KID_TIME_OVERLAP:
        the same kid appears on two overlapping events (amber only; creation is
        allowed). ADULT_COVERAGE_OVERLAP: the same adult has active
        (PENDING/CONFIRMED) coverage on two overlapping events with at least one
        PENDING (or anomalous CONFIRMED+CONFIRMED). Overlap uses event
        startsAt/endsAt only (null endsAt → zero-length at startsAt).
      enum:
        - KID_TIME_OVERLAP
        - ADULT_COVERAGE_OVERLAP

    CalendarConflict:
      type: object
      required:
        - type
        - otherSource
        - otherItemId
        - otherTitle
        - otherStartsAt
      properties:
        type:
          $ref: "#/components/schemas/CalendarConflictType"
        kidId:
          type: string
          format: uuid
          nullable: true
          description: Present when type is KID_TIME_OVERLAP; null otherwise
        adultId:
          type: string
          format: uuid
          nullable: true
          description: Present when type is ADULT_COVERAGE_OVERLAP; null otherwise
        adultDisplayName:
          type: string
          nullable: true
          description: >
            Display name for adultId when type is ADULT_COVERAGE_OVERLAP; null
            otherwise
          example: Jordan
        otherSource:
          $ref: "#/components/schemas/CalendarItemSource"
        otherItemId:
          type: string
          format: uuid
          description: Conflicting peer calendar item id
        otherTitle:
          type: string
          description: Title/summary of the conflicting peer item
          example: Game
        otherStartsAt:
          type: string
          format: date-time
          description: startsAt of the conflicting peer item (UTC)
          example: "2026-08-15T17:30:00Z"

    LeaveByStatus:
      type: string
      description: >
        Whether an estimated leave-by could be computed for the current adult.
        OK means leaveByAt is set (from OSRM, a cached driving duration, or
        OSRM-down fallback). UNAVAILABLE means leaveByAt is null (missing
        origin, blank location, or geocode failure). PENDING means the calendar
        list did not call Nominatim or OSRM and dest/duration caches missed;
        clients should GET …/calendar/leave-by. listCalendarLeaveBy never
        returns PENDING.
      enum:
        - OK
        - UNAVAILABLE
        - PENDING

    CalendarLeaveBy:
      type: object
      required:
        - id
        - source
        - leaveByStatus
      properties:
        id:
          type: string
          format: uuid
          description: Manual event id or feed event id
        source:
          $ref: "#/components/schemas/CalendarItemSource"
        leaveFromPlaceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Current adult's leave-from place for this item (explicit override or
            default located place). Null when no located place is available.
        leaveFromPlaceName:
          type: string
          nullable: true
          description: Display name of leaveFromPlaceId when set
          example: Mom's house
        leaveByAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Estimated leave-by instant (UTC) for the current adult. Null when
            leaveByStatus is UNAVAILABLE. Always an estimate — not live traffic.
          example: "2026-08-15T15:25:00Z"
        leaveByStatus:
          $ref: "#/components/schemas/LeaveByStatus"
        leaveByReason:
          type: string
          nullable: true
          description: >
            Machine-readable reason when leaveByStatus is UNAVAILABLE (e.g.
            NO_ORIGIN, NO_DESTINATION, GEOCODE_FAILED). Null when OK. This
            operation does not return PENDING.
          example: NO_ORIGIN

    SetCalendarLeaveFromRequest:
      type: object
      required:
        - leaveFromPlaceId
      properties:
        leaveFromPlaceId:
          type: string
          format: uuid
          description: >
            Circle place to use as this adult's leave-from for the calendar item.
            Must be located (non-null latitude and longitude).
          example: 01900000-0000-7000-8000-000000000031

    SetDefaultLeaveFromRequest:
      type: object
      properties:
        placeId:
          type: string
          format: uuid
          nullable: true
          description: >
            Circle place to use as this adult's default leave-from. Null clears
            the default. Must be located when non-null.
          example: 01900000-0000-7000-8000-000000000031

    CoverageStatus:
      type: string
      description: >
        Coverage assignment lifecycle. PENDING and CONFIRMED are active (hold
        kids). DECLINED releases the kids.
      enum:
        - PENDING
        - CONFIRMED
        - DECLINED

    RsvpStatus:
      type: string
      description: >
        Per-kid attendance on a calendar item. NO_RESPONSE is the default when
        no row is stored. YES and NO are persisted; setting NO_RESPONSE deletes
        the row.
      enum:
        - YES
        - NO
        - NO_RESPONSE

    CalendarRsvp:
      type: object
      required:
        - kidId
        - status
      properties:
        kidId:
          type: string
          format: uuid
          description: Kid on the calendar item
        status:
          $ref: "#/components/schemas/RsvpStatus"

    SetCalendarRsvpRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/RsvpStatus"

    CalendarCoverageAssignment:
      type: object
      required:
        - id
        - coveringAdultId
        - assignedByAdultId
        - kidIds
        - status
      properties:
        id:
          type: string
          format: uuid
          description: Stable assignment identifier
        coveringAdultId:
          type: string
          format: uuid
          description: Adult responsible for covering the listed kids
        coveringAdultDisplayName:
          type: string
          nullable: true
          description: Display name of coveringAdultId when known
          example: Sam
        assignedByAdultId:
          type: string
          format: uuid
          description: Adult who created or last reassigned this assignment
        kidIds:
          type: array
          minItems: 1
          description: Kids on the calendar item covered by this assignment
          items:
            type: string
            format: uuid
        status:
          $ref: "#/components/schemas/CoverageStatus"

    AssignCalendarCoverageRequest:
      type: object
      required:
        - coveringAdultId
        - kidIds
      properties:
        coveringAdultId:
          type: string
          format: uuid
          description: Adult to assign coverage responsibility to
          example: 01900000-0000-7000-8000-000000000002
        kidIds:
          type: array
          minItems: 1
          description: One or more kids on the calendar item to cover
          items:
            type: string
            format: uuid

    CalendarItem:
      type: object
      required:
        - id
        - source
        - title
        - startsAt
        - kidIds
        - leaveByStatus
        - coverages
        - uncoveredKidIds
        - conflicts
        - rsvps
      properties:
        id:
          type: string
          format: uuid
          description: Manual event id or feed event id
        source:
          $ref: "#/components/schemas/CalendarItemSource"
        title:
          type: string
          description: Manual title or feed event summary
          example: Practice
        startsAt:
          type: string
          format: date-time
          description: Event start instant (UTC)
          example: "2026-08-15T17:00:00Z"
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: Optional end instant (UTC)
          example: "2026-08-15T18:00:00Z"
        location:
          type: string
          nullable: true
          maxLength: 500
          description: Optional free-text location (geocoded for leave-by destination)
          example: Field 3
        kidIds:
          type: array
          description: >
            Manual: event↔kids. Feed: kids linked to the parent activity feed.
          items:
            type: string
            format: uuid
        feedId:
          type: string
          format: uuid
          nullable: true
          description: Present when source is FEED; omitted/null for MANUAL
        feedName:
          type: string
          nullable: true
          description: Present when source is FEED; omitted/null for MANUAL
          example: U12
        eventKey:
          type: string
          nullable: true
          description: >
            Carpool-compatible event identity, same formula as
            CarpoolRide.eventKey. `UID:<icalUid>` when the feed event has an
            iCal UID; otherwise `FP:<normalized title>|<startsAt>|<normalized
            location>`. Null for MANUAL items.
          example: "UID:abc123@example.com"
        leaveFromPlaceId:
          type: string
          format: uuid
          nullable: true
          description: >
            Current adult's leave-from place for this item (explicit override or
            default located place). Null when no located place is available.
        leaveFromPlaceName:
          type: string
          nullable: true
          description: Display name of leaveFromPlaceId when set
          example: Mom's house
        leaveByAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Estimated leave-by instant (UTC) for the current adult. Null when
            leaveByStatus is UNAVAILABLE or PENDING. Always an estimate — not
            live traffic.
          example: "2026-08-15T15:25:00Z"
        leaveByStatus:
          $ref: "#/components/schemas/LeaveByStatus"
        leaveByReason:
          type: string
          nullable: true
          description: >
            Machine-readable reason when leaveByStatus is UNAVAILABLE (e.g.
            NO_ORIGIN, NO_DESTINATION, GEOCODE_FAILED). Null when OK or PENDING.
          example: NO_ORIGIN
        coverages:
          type: array
          description: Coverage assignments on this calendar item for the circle
          items:
            $ref: "#/components/schemas/CalendarCoverageAssignment"
        uncoveredKidIds:
          type: array
          description: >
            In-play kids on this item (RSVP YES or NO_RESPONSE) not covered by
            any active (PENDING or CONFIRMED) assignment. Kids with RSVP NO are
            never included.
          items:
            type: string
            format: uuid
        conflicts:
          type: array
          description: >
            Server-computed conflicts for this item (kid time-overlaps ignore
            RSVP NO kids; adult coverage overlaps). Empty when none. Clients
            should render amber chrome from this list; do not re-derive overlap
            rules for truth. Travel / leave-by “cutting it close” is out of
            scope for this revision.
          items:
            $ref: "#/components/schemas/CalendarConflict"
        rsvps:
          type: array
          description: >
            One entry per kid on the item. Missing stored rows materialize as
            NO_RESPONSE. Circle-visible.
          items:
            $ref: "#/components/schemas/CalendarRsvp"

    CreateManualEventRequest:
      type: object
      required:
        - title
        - startsAt
        - kidIds
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: Dentist
        startsAt:
          type: string
          format: date-time
          example: "2026-08-15T17:00:00Z"
        endsAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-08-15T18:00:00Z"
        location:
          type: string
          nullable: true
          maxLength: 500
          example: Clinic
        kidIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    UpdateManualEventRequest:
      type: object
      required:
        - title
        - startsAt
        - kidIds
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: Dentist (follow-up)
        startsAt:
          type: string
          format: date-time
          example: "2026-08-15T17:00:00Z"
        endsAt:
          type: string
          format: date-time
          nullable: true
          example: null
        location:
          type: string
          nullable: true
          maxLength: 500
          example: Clinic
        kidIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid

    CarpoolSpaceMembership:
      type: string
      enum: [OWNER, MEMBER]
      description: >
        OWNER is the circle that Enabled the space. MEMBER is any later
        admitted circle (code join or owner Admit). Membership is the family
        circle, not the individual adult.

    CarpoolFeedStatusKind:
      type: string
      enum: [NONE, AVAILABLE, REQUESTED, MEMBER, OWNER]
      description: >
        NONE — no space for this feed's normalized URL (Organizer may Enable).
        AVAILABLE — space exists, this circle is not a member and has no
        PENDING request (Request + Have a code; no member list, invite code,
        or rides). REQUESTED — PENDING join request from this circle. MEMBER
        / OWNER — this circle belongs to the space (details on `spaces`).

    CarpoolFeedStatus:
      type: object
      required:
        - feedId
        - feedName
        - status
      properties:
        feedId:
          type: string
          format: uuid
        feedName:
          type: string
          example: Soccer - Crossbar
        status:
          $ref: "#/components/schemas/CarpoolFeedStatusKind"
        spaceId:
          type: string
          format: uuid
          nullable: true
          description: Null when status is NONE
        spaceName:
          type: string
          nullable: true
          description: >
            Space name when a space exists for this URL (including AVAILABLE
            / REQUESTED). Null when status is NONE. Not a member list.

    CarpoolSpaceMember:
      type: object
      required:
        - circleId
        - membership
      properties:
        circleId:
          type: string
          format: uuid
        circleName:
          type: string
          nullable: true
          description: Null when unnamed; clients should show "Your family"
        membership:
          $ref: "#/components/schemas/CarpoolSpaceMembership"

    CarpoolJoinRequest:
      type: object
      required:
        - id
        - spaceId
        - circleId
        - requestedByAdultId
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        circleId:
          type: string
          format: uuid
        circleName:
          type: string
          nullable: true
          description: Requesting circle's name
        requestedByAdultId:
          type: string
          format: uuid
          description: Adult who submitted the request
        requestedByDisplayName:
          type: string
          nullable: true
          description: Display name of the adult who submitted the request

    CarpoolInvite:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 8
          description: >
            Human-shareable invite code for the space. Same alphabet and
            length as family invites (8 chars,
            `ABCDEFGHJKLMNPQRSTUVWXYZ23456789`). Case-insensitive on join;
            one active code per space until the owning circle regenerates.
            No TTL. Share out of band (no email/push).
          example: AB12CD34

    CarpoolSpace:
      type: object
      required:
        - id
        - name
        - membership
        - inviteCode
        - members
        - pendingRequests
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Copied from the enabling feed (or space name on code-join ensureFeed)
          example: Soccer - Crossbar
        membership:
          $ref: "#/components/schemas/CarpoolSpaceMembership"
          description: Caller's circle membership in this space
        inviteCode:
          type: string
          minLength: 8
          maxLength: 8
          description: Current invite code (any space member may view/copy)
          example: AB12CD34
        callerFeedId:
          type: string
          format: uuid
          nullable: true
          description: >
            This circle's feed for the space's normalized URL, when present.
            Null if the circle later deleted that feed (space stays).
        members:
          type: array
          description: Member circles by name only — not other families' kids
          items:
            $ref: "#/components/schemas/CarpoolSpaceMember"
        pendingRequests:
          type: array
          description: >
            PENDING join requests. Populated for OWNER-circle callers; empty
            for MEMBER. In-app only (no push).
          items:
            $ref: "#/components/schemas/CarpoolJoinRequest"

    CarpoolSummary:
      type: object
      required:
        - circleRole
        - feeds
        - spaces
      properties:
        circleRole:
          $ref: "#/components/schemas/FamilyRole"
          description: >
            Caller's role in their family circle. Enable is shown only when
            this is ORGANIZER and a feed row has status NONE. Caregivers
            omit Enable.
        feeds:
          type: array
          description: One row per circle feed (empty when the circle has no feeds)
          items:
            $ref: "#/components/schemas/CarpoolFeedStatus"
        spaces:
          type: array
          description: >
            Spaces this circle belongs to (OWNER or MEMBER). Does not include
            AVAILABLE / REQUESTED spaces — those appear only as feed status.
            A circle may belong to many spaces (one per team / feed).
          items:
            $ref: "#/components/schemas/CarpoolSpace"

    EnableCarpoolSpaceRequest:
      type: object
      required:
        - feedId
      properties:
        feedId:
          type: string
          format: uuid
          description: Circle feed to enable a space on (must already exist)
          example: 01900000-0000-7000-8000-000000000041

    JoinCarpoolSpaceRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
          description: Invite code from a space member (listserv shortcut)
          example: AB12CD34

    CarpoolRideStatus:
      type: string
      enum: [PENDING, ACCEPTED, CANCELLED]
      description: >
        PENDING — awaiting a driver. ACCEPTED — a member circle committed a
        vehicle. CANCELLED — requesting circle cancelled (may request again).

    CarpoolRide:
      type: object
      required:
        - id
        - spaceId
        - eventKey
        - requestingCircleId
        - requestedByAdultId
        - kidIds
        - kidFirstNames
        - seats
        - pickupPlaceName
        - pickupAddress
        - status
        - passedByMe
        - passedByAdultNames
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        eventKey:
          type: string
          description: >
            Cross-circle event identity. `UID:<icalUid>` when the feed event
            has an iCal UID; otherwise `FP:<normalized title>|<startsAt>|
            <normalized location>`.
          example: "UID:abc123@example.com"
        requestingCircleId:
          type: string
          format: uuid
        requestingCircleName:
          type: string
          nullable: true
          description: Requesting circle's name (for other circles' requests)
        requestedByAdultId:
          type: string
          format: uuid
          description: Adult who created the request (pickup place is theirs)
        kidIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        kidFirstNames:
          type: array
          minItems: 1
          description: Snapshot at create for display to other member circles
          items:
            type: string
        seats:
          type: integer
          minimum: 1
          description: Number of kids requested (= kidIds.length)
        pickupPlaceName:
          type: string
          description: Snapshot of requester's pickup place name at create
        pickupAddress:
          type: string
          description: Snapshot of requester's pickup address at create
        status:
          $ref: "#/components/schemas/CarpoolRideStatus"
        passedByMe:
          type: boolean
          description: >
            True when the calling adult has passed on this PENDING request.
            Always false on ownRequest, on ACCEPTED/CANCELLED rides, and on
            create/accept/cancel/withdraw responses. On list rides, true only
            for otherRequests entries the caller has passed; those rows stay
            visible. Soft decline: non-Focus surfaces may still offer Accept
            while status is PENDING; Focus ranking/CTAs may skip passed asks.
        passedByAdultNames:
          type: array
          description: >
            Display names of adults who have passed on this ride, ordered by
            pass createdAt ascending. Empty when none, and after passes are
            cleared (Accept or Cancel). Present on list rides and on pass
            responses; empty on create/accept/cancel/withdraw.
          items:
            type: string
        acceptedByAdultId:
          type: string
          format: uuid
          nullable: true
          description: Set when status is ACCEPTED
        acceptingCircleId:
          type: string
          format: uuid
          nullable: true
          description: Set when status is ACCEPTED
        acceptingCircleName:
          type: string
          nullable: true
          description: Accepting circle's name when status is ACCEPTED
        vehicleId:
          type: string
          format: uuid
          nullable: true
          description: Committed vehicle when status is ACCEPTED
        vehicleLabel:
          type: string
          nullable: true
          description: Vehicle nickname when status is ACCEPTED

    CarpoolRideEvent:
      type: object
      required:
        - eventKey
        - title
        - startsAt
        - defaultKidIds
        - otherRequests
      properties:
        eventKey:
          type: string
          description: Same identity scheme as CarpoolRide.eventKey
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        defaultKidIds:
          type: array
          description: >
            This circle's feed-linked kids on this event who are not RSVP NO
            and not already on this circle's ACCEPTED ride
            (YES and NO_RESPONSE both qualify; stable order = feed kid link
            order; for Request pre-fill; empty when none qualify)
          items:
            type: string
            format: uuid
        ownRequest:
          allOf:
            - $ref: "#/components/schemas/CarpoolRide"
          nullable: true
          description: >
            This circle's active request (PENDING or ACCEPTED), if any. Null
            when none or last request was CANCELLED. passedByMe is always
            false here; passedByAdultNames lists adults from other circles
            who passed (for requester visibility).
        otherRequests:
          type: array
          description: >
            Other member circles' PENDING or ACCEPTED requests on this event.
            Includes PENDING asks the calling adult has passed
            (passedByMe true). Soft decline: Accept may still be offered on
            non-Focus surfaces while PENDING.
          items:
            $ref: "#/components/schemas/CarpoolRide"

    CreateCarpoolRideRequest:
      type: object
      required:
        - eventKey
      properties:
        eventKey:
          type: string
          description: Target feed event identity (must match a listed event)
        kidIds:
          type: array
          minItems: 1
          description: >
            Non-empty subset of defaultKidIds. When omitted, server defaults to
            all kids in that default set. Create does not change RSVP.
          items:
            type: string
            format: uuid

    AcceptCarpoolRideRequest:
      type: object
      required:
        - vehicleId
      properties:
        vehicleId:
          type: string
          format: uuid
          description: >
            Caller's circle vehicle they may drive with enough remaining seats

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Invalid or expired code
