spring:
  application:
    name: family-carpool
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/family_carpool}
    username: ${DATABASE_USERNAME:family_carpool}
    password: ${DATABASE_PASSWORD:family_carpool}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  auth:
    code-length: 6
    code-ttl-seconds: 600
    code-pepper: ${AUTH_CODE_PEPPER:dev-only-change-me}
    session-ttl-seconds: 2592000
    request-code-limit: 5
    request-code-window-seconds: 900
    verify-code-limit: 10
    verify-code-window-seconds: 900
    # Local smoke: echo OTP in request-code response + log it. Never enable in prod.
    dev-code-echo: ${AUTH_DEV_CODE_ECHO:true}
  feeds:
    # http (default) or stub (CI / offline soft-fail demos)
    fetch-provider: ${FEEDS_FETCH_PROVIDER:http}
    user-agent: ${FEEDS_USER_AGENT:family-carpool/0.1 (https://github.com/mccajr2/family-carpool)}
    # Background poll of all feeds (single-instance assumption for v1).
    poll-enabled: ${FEEDS_POLL_ENABLED:true}
    poll-interval-ms: ${FEEDS_POLL_INTERVAL_MS:1800000}
    poll-initial-delay-ms: ${FEEDS_POLL_INITIAL_DELAY_MS:60000}
    poll-inter-feed-delay-ms: ${FEEDS_POLL_INTER_FEED_DELAY_MS:250}
  geocode:
    # nominatim (default) or stub (CI / offline soft-fail demos)
    provider: ${GEOCODE_PROVIDER:nominatim}
    nominatim-base-url: ${GEOCODE_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    # Must identify the app + contact (URL or email). example.com contacts get 403.
    # Override with GEOCODE_USER_AGENT for your deploy / personal contact.
    user-agent: ${GEOCODE_USER_AGENT:family-carpool/0.1 (https://github.com/mccajr2/family-carpool)}
    min-interval-ms: ${GEOCODE_MIN_INTERVAL_MS:1000}
  leaveby:
    # Fixed buffer + TOD multipliers applied after OSRM (or fallback) travel seconds.
    fixed-buffer-seconds: ${LEAVEBY_FIXED_BUFFER_SECONDS:300}
    # Used when origin+destination coords exist but OSRM is unreachable.
    fallback-duration-seconds: ${LEAVEBY_FALLBACK_DURATION_SECONDS:1800}
    peak-multiplier: ${LEAVEBY_PEAK_MULTIPLIER:1.25}
    off-peak-multiplier: ${LEAVEBY_OFF_PEAK_MULTIPLIER:1.0}
    # Peak windows use the event startsAt hour in UTC [start, end).
    morning-peak-start-hour-utc: ${LEAVEBY_MORNING_PEAK_START_HOUR_UTC:7}
    morning-peak-end-hour-utc: ${LEAVEBY_MORNING_PEAK_END_HOUR_UTC:9}
    evening-peak-start-hour-utc: ${LEAVEBY_EVENING_PEAK_START_HOUR_UTC:16}
    evening-peak-end-hour-utc: ${LEAVEBY_EVENING_PEAK_END_HOUR_UTC:19}
    osrm:
      # http (default) or stub (CI / offline)
      provider: ${LEAVEBY_OSRM_PROVIDER:http}
      base-url: ${LEAVEBY_OSRM_BASE_URL:https://router.project-osrm.org}

logging:
  level:
    com.yourorg.quickapp.auth: INFO
