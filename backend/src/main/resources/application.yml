spring:
  application:
    name: family-carpool
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/family_carpool}
    username: ${DATABASE_USERNAME:family_carpool}
    password: ${DATABASE_PASSWORD:family_carpool}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  auth:
    code-length: 6
    code-ttl-seconds: 600
    code-pepper: ${AUTH_CODE_PEPPER:dev-only-change-me}
    session-ttl-seconds: 2592000
    request-code-limit: 5
    request-code-window-seconds: 900
    verify-code-limit: 10
    verify-code-window-seconds: 900
    # Local smoke: echo OTP in request-code response + log it. Never enable in prod.
    dev-code-echo: ${AUTH_DEV_CODE_ECHO:true}
  feeds:
    # http (default) or stub (CI / offline soft-fail demos)
    fetch-provider: ${FEEDS_FETCH_PROVIDER:http}
    user-agent: ${FEEDS_USER_AGENT:family-carpool/0.1 (https://github.com/mccajr2/family-carpool)}
  geocode:
    # nominatim (default) or stub (CI / offline soft-fail demos)
    provider: ${GEOCODE_PROVIDER:nominatim}
    nominatim-base-url: ${GEOCODE_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    # Must identify the app + contact (URL or email). example.com contacts get 403.
    # Override with GEOCODE_USER_AGENT for your deploy / personal contact.
    user-agent: ${GEOCODE_USER_AGENT:family-carpool/0.1 (https://github.com/mccajr2/family-carpool)}
    min-interval-ms: ${GEOCODE_MIN_INTERVAL_MS:1000}

logging:
  level:
    com.yourorg.quickapp.auth: INFO
